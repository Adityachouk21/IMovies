services:
  mongodb:
    image: mongo:7.0
    container_name: imovies-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: imovies
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imovies-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/imovies
      JWT_SECRET: imovies_super_secret_jwt_key_2026_production
      CLIENT_URL: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imovies-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:

services:
  # ========================================================
  # 🎬 iMovies Backend Web Service (Node.js + Socket.io)
  # ========================================================
  - type: web
    name: imovies-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: COOKIE_NAME
        value: imovies_token
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ========================================================
  # 💻 iMovies Frontend Static Site (Vite React SPA)
  # (Deploy this on Render, OR deploy frontend on Vercel)
  # ========================================================
  - type: web
    name: imovies-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
